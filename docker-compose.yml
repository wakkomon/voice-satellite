version: "2.4"            # noetig fuer docker-compose v1 auf dem Pi
services:
  voice-satellite:
    build: .
    image: voice-satellite:0.1.0
    container_name: voice-satellite
    restart: unless-stopped
    # Kein privileged! Nur das Audio-Device durchreichen.
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    env_file:
      - .env              # Secrets & API-URLs lives on the Pi, never in the image
    environment:
      - MIC_DEVICE=${MIC_DEVICE:-plughw:2,0}
      - SPEAKER_DEVICE=${SPEAKER_DEVICE:-plughw:1,0}
      - WAKE_SENS=${WAKE_SENS:-0.5}
      - VAD_MODE=${VAD_MODE:-energy}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - voice-satellite-data:/data   # gleichnamiges Volume wie docker run
    ports:
      - "8770:8770"       # Debug-Interface

volumes:
  voice-satellite-data:
