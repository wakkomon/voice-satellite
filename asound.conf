# Identisch zur Pi-Konfiguration: Einspielen in den Container, damit die
# Karten-Nummern (hw:1,0 Speaker / hw:2,0 USB-Mic) wie am Host funktionieren.
pcm.!default {
    type asym
    playback.pcm "plug:hw:1,0"
    capture.pcm "virt_mic"
}

pcm.virt_mic {
    type plug
    slave {
        pcm "hw:2,0"
        rate 44100
        format S16_LE
        channels 1
    }
}

pcm.virt_mic_16k {
    type rate
    slave {
        pcm "hw:2,0"
        rate 44100
    }
    rate 16000
}

ctl.!default {
    type hw
    card 1
}
