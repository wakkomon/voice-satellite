# Identisch zur Pi-Konfiguration: Einspielen in den Container, damit die
# Karten-Nummern (hw:1,0 Speaker / hw:2,0 USB-Mic) wie am Host funktionieren.
#
# dmix: mehrere Programme koennen GLEICHZEITIG auf den Speaker schreiben –
# mpg123 (Musik/Radio) und aplay (TTS) ueberblenden sich, Alexastyl:
# "Ich spiele Jazz" erklingt, waehrend die Musik schon laeuft.
# Fehlt der dmix-Slave (z.B. Desktop ohne Mehrkanal-Karte), faellt das
# plug-Plugin auf den hw-Device zurueck.
pcm.!default {
    type asym
    playback.pcm "plug:dmixer"
    capture.pcm "virt_mic"
}

pcm.dmixer {
    type dmix
    ipc_key 67321
    slave {
        # dmix verlangt ein nacktes hw-Device als Slave; plug wandelt im
        # dmix-Request (22050/1-Chan TTS-WAV wie 44100-MP3) auf diese
        # Parameter um.
        pcm "hw:1,0"
        rate 44100
        channels 2
        format S16_LE
    }
}

pcm.virt_mic {
    type plug
    slave {
        pcm "hw:2,0"
        rate 44100
        format S16_LE
        channels 1
    }
}

pcm.virt_mic_16k {
    type rate
    slave {
        pcm "hw:2,0"
        rate 44100
    }
    rate 16000
}

ctl.!default {
    type hw
    card 1
}
