<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Satellite</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
       background:#0f1216; color:#e6e9ee; }
header { display:flex; align-items:center; gap:12px; padding:14px 18px;
         border-bottom:1px solid #232833; }
h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
.badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;
         background:#1c212b; border:1px solid #2c3340; white-space:nowrap; }
.badge.wake       { color:#5fd068; border-color:#2b5e32; background:#14241a; }
.badge.recording  { color:#57a8ff; border-color:#274b6e; background:#12233a; }
.badge.processing { color:#e8b34b; border-color:#6e5a27; background:#2b2413; }
.badge.speaking   { color:#b48cff; border-color:#4d3a78; background:#1e1733; }
.badge.live       { animation:pulse 1.2s infinite; }
/* Master-Verbindung: grün=verbunden, gelb=Fallback, rot=getrennt */
.badge.master-ok   { color:#5fd068; border-color:#2b5e32; background:#14241a; }
.badge.master-fb   { color:#e8b34b; border-color:#6e5a27; background:#2b2413; }
.badge.master-off  { color:#e85555; border-color:#6e2b2b; background:#2b1414; }
.dot { width:9px; height:9px; border-radius:50%; background:#e85555;
       margin-left:auto; flex:none; }
.dot.on { background:#5fd068; }
/* Header-Index-Button: klein, mit Dateizähler + Baupuls */
.btn-idx { background:#1e293b; border:1px solid #334155; border-radius:6px;
           color:#94a3b8; font-size:11px; padding:2px 8px; cursor:pointer;
           line-height:1; white-space:nowrap; flex:none;
           display:flex; align-items:center; gap:5px; }
.btn-idx:hover { background:#334155; color:#e6e9ee; }
.btn-idx .icon { font-size:14px; }
.btn-idx .count { font-variant-numeric:tabular-nums; min-width:28px; text-align:right; }
.btn-idx.busy { animation:pulse 1.2s infinite; }
.stats { display:flex; gap:10px; padding:12px 18px; flex-wrap:wrap; }
.card { background:#161b22; border:1px solid #232833; border-radius:10px;
        padding:10px 14px; min-width:96px; }
.card .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
.card .l { font-size:11px; color:#8b93a1; text-transform:uppercase;
           letter-spacing:.5px; margin-top:2px; }
main { padding:0 18px 18px; }
.feed { background:#11151b; border:1px solid #232833; border-radius:10px;
        height:320px; overflow-y:auto; list-style:none; margin:0; padding:8px; }
.feed li { padding:4px 8px; border-bottom:1px solid #1b202a; font-size:13px; }
.feed li time { color:#8b93a1; margin-right:8px; font-variant-numeric:tabular-nums; }
.empty { color:#5b6472; text-align:center; margin-top:140px; }
.forms { display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
form { flex:1; min-width:260px; }
input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #2c3340;
        background:#161b22; color:#e6e9ee; font-size:14px; margin-bottom:8px; }
input:focus { outline:none; border-color:#2563eb; }
button { padding:9px 14px; border-radius:8px; border:0; background:#2563eb;
         color:#fff; font-size:14px; cursor:pointer; }
button:hover { background:#1d4ed8; }
button:disabled { opacity:.5; cursor:default; }
.res { margin-top:8px; font-size:13px; color:#9fb3c8; min-height:18px; }
.actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.action-btn { flex:1; min-width:120px; font-size:13px; }
.action-btn.stop-btn { background:#b3372f; }
.action-btn.stop-btn:hover { background:#8f2b24; }
.music { margin-top:14px; background:#11151b; border:1px solid #232833;
         border-radius:10px; padding:12px 14px; }
.display { margin-top:14px; background:#11151b; border:1px solid #232833;
           border-radius:10px; padding:12px 14px; }
.display .head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.display .tag { font-size:11px; color:#8b93a1; text-transform:uppercase;
                letter-spacing:.5px; }
#disp-img { width:100%; max-width:480px; display:block; background:#000;
            border:1px solid #232833; border-radius:6px;
            image-rendering:pixelated; }
.disp-note { font-size:12px; color:#5b6472; margin-top:6px; }
.music .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.music .title { font-size:14px; font-weight:600; flex:1; min-width:0;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.music .tag { font-size:11px; color:#8b93a1; text-transform:uppercase;
              letter-spacing:.5px; }
.b-action { flex:1; min-width:110px; font-size:13px; }
.b-action.stop-btn { background:#b3372f; }
.b-action.stop-btn:hover { background:#8f2b24; }
.b-action.active { background:#1d4ed8; box-shadow:0 0 0 1px #2563eb inset; }
.b-action.busy { opacity:.6; cursor:default; }
.b-index { background:#334155; }
.b-index:hover { background:#3b4a63; }
.vol-row { margin-top:10px; }
input[type=range] { width:auto; flex:1; padding:0; margin:0;
                    accent-color:#2563eb; }
.vol-pct { font-size:13px; color:#e6e9ee; font-variant-numeric:tabular-nums;
           min-width:52px; text-align:right; }
/* ── Mic-Mute-Button ─────────────────────────────────────── */
.btn-mic { background:#1c212b; border:1px solid #2c3340; border-radius:6px;
           color:#e6e9ee; font-size:15px; padding:3px 9px; cursor:pointer;
           line-height:1; white-space:nowrap; flex:none; }
.btn-mic:hover { background:#2c3340; }
.btn-mic.muted { color:#e8b34b; border-color:#6e5a27; }

/* ── Config Modal ────────────────────────────────────────── */
#config-modal {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:1000; align-items:center; justify-content:center;
}
#config-modal.open { display:flex; }
#config-box {
  background:#161b22; border:1px solid #232833; border-radius:12px;
  padding:20px 24px; max-width:540px; width:90%; max-height:80vh;
  overflow-y:auto; color:#e6e9ee;
}
#config-box h2 { margin:0 0 14px; font-size:16px; color:#e6e9ee; }
#config-box table { width:100%; border-collapse:collapse; font-size:13px; }
#config-box td { padding:4px 8px; border-bottom:1px solid #232833; vertical-align:top; }
#config-box td:first-child { color:#8b93a1; width:180px; white-space:nowrap; }
#config-box td:last-child { font-family:monospace; color:#c9d1d9; }
#config-box .hidden-key { color:#e85555; }
#config-box .close-btn {
  margin-top:14px; background:#2c3340; border:1px solid #3d4450;
  padding:6px 16px; border-radius:6px; color:#e6e9ee; cursor:pointer;
  font-size:13px;
}
#config-box .close-btn:hover { background:#3d4450; }

/* ── Media Browser ─────────────────────────────────────────────── */
#media-browser { margin-top:14px; background:#11151b; border:1px solid #232833;
                 border-radius:10px; padding:12px 14px; display:none; }
#media-browser.visible { display:block; }
#media-browser .head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
#media-browser .tag { font-size:11px; color:#8b93a1; text-transform:uppercase;
                      letter-spacing:.5px; }
#media-browser .title { font-size:14px; font-weight:600; }
#media-browser .toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
#media-browser .toolbar .tab { padding:4px 12px; border-radius:6px; font-size:12px;
                                background:#1e293b; color:#94a3b8; cursor:pointer;
                                border:1px solid #334155; }
#media-browser .toolbar .tab.active { background:#1d4ed8; color:#fff; border-color:#2563eb; }
#media-browser .search-row { display:flex; gap:6px; margin-bottom:10px; }
#media-browser .search-row input { flex:1; padding:6px 10px; border-radius:6px;
                                    background:#1e293b; border:1px solid #334155;
                                    color:#e6e9ee; font-size:13px; }
#media-browser .search-row input:focus { outline:none; border-color:#2563eb; }
#media-browser .search-row input::placeholder { color:#5b6472; }
#media-browser .tree-header { display:flex; align-items:center; gap:6px; margin-bottom:8px;
                               flex-wrap:wrap; }
#media-browser .breadcrumb { font-size:12px; color:#64748b; }
#media-browser .breadcrumb span { cursor:pointer; color:#60a5fa; }
#media-browser .breadcrumb span:hover { text-decoration:underline; }
#media-browser .tree-list { max-height:400px; overflow-y:auto; margin:0; padding:0; }
#media-browser .tree-item { display:flex; align-items:center; gap:8px; padding:5px 8px;
                             border-radius:6px; cursor:pointer; font-size:13px;
                             color:#cbd5e1; }
#media-browser .tree-item:hover { background:#1e293b; color:#f1f5f9; }
#media-browser .tree-item.dir { color:#93c5fd; }
#media-browser .tree-item.file { color:#cbd5e1; }
#media-browser .tree-item .icon { font-size:14px; width:20px; text-align:center; flex-shrink:0; }
#media-browser .tree-item .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                                  white-space:nowrap; }
#media-browser .tree-item .count { font-size:11px; color:#64748b; flex-shrink:0; }
#media-browser .tree-item.playing { background:#1e3a5f; color:#93c5fd; }
#media-browser .empty { color:#5b6472; font-size:13px; padding:20px 8px; text-align:center; }

#vol-pct.muted { color:#e8b34b; }
@keyframes pulse { 50% { opacity:.45; } }
</style>
</head>
<body>
<header>
  <h1>Voice Satellite</h1>
  <span id="state" class="badge wake">Bereit</span>
  <span id="master" class="badge master-off" title="Master-Container-Verbindung" hidden>Master –</span>
  <button id="b-mic-mute" class="btn-mic" title="Mikrofon stummschalten">🎤</button>
  <span class="badge" id="idx-count" title="Indizierte Dateien (Quelle: Master) –">–</span>
  <span class="badge" id="ver" title="Software-Version">–</span>
  <button id="b-config-info" class="btn-mic" title="Konfiguration anzeigen">ℹ️</button>
  <span class="dot" id="conn" title="Live-Verbindung"></span>
</header>
<div class="stats">
  <div class="card"><div class="v" id="st-uptime">–</div><div class="l">Laufzeit</div></div>
  <div class="card"><div class="v" id="st-wakes">0</div><div class="l">Codewörter</div></div>
  <div class="card"><div class="v" id="st-commands">0</div><div class="l">Befehle</div></div>
  <div class="card"><div class="v" id="st-llm">0</div><div class="l">LLM</div></div>
  <div class="card"><div class="v" id="st-errors">0</div><div class="l">Fehler</div></div>
  <div class="card"><div class="v" id="st-index-files">–</div><div class="l">MP3/Dateien</div></div>
  <div class="card"><div class="v" id="st-index-m3u">–</div><div class="l">Playlists</div></div>
</div>
<main>
  <div class="display">
    <div class="head">
      <span class="tag">Display</span>
      <span class="tag" id="disp-ts" title="Zeitstempel des zuletzt geladenen Bildes"></span>
    </div>
    <img id="disp-img" alt="Aktuelles Display-Bild">
    <div class="disp-note" id="disp-note" style="display:none">Display nicht aktiv</div>
  </div>
  <div class="music">
    <div class="row">
      <span class="tag" id="m-state">Musik</span>
      <span class="title" id="m-title">Nichts abspielt</span>
    </div>
    <div class="row">
      <button id="b-music-toggle" class="b-action" title="Pause" style="display:none">⏸ Pause</button>
      <button id="b-music-stop" class="b-action stop-btn" title="Musik stoppen">⏹ Stopp</button>
      <button id="b-music-prev" class="b-action" title="Vorheriger Titel">⏮ Zurück</button>
      <button id="b-music-next" class="b-action" title="Nächster Titel">⏭ Weiter</button>
      <button id="b-music-shuffle" class="b-action" title="Zufallswiedergabe">🔀 Shuffle</button>
    </div>
    <div class="row vol-row">
      <span class="tag">Lautstärke</span>
      <input type="range" id="vol-slider" min="0" max="100" step="1" value="100">
      <span class="vol-pct" id="vol-pct">100 %</span>
    </div>
    <div style="margin-top:10px;">
      <button id="b-media-toggle" class="action-btn" style="min-width:auto; padding:4px 14px; font-size:12px;">📚 Bibliothek</button>
    </div>
  </div>
  <!-- ── Media Browser ──────────────────────────────────────────── -->
  <div id="media-browser">
    <div class="head">
      <span class="tag">Mediathek</span>
      <span class="title" id="mb-title">Bibliothek</span>
    </div>
    <div class="toolbar">
      <div class="tab active" data-view="tree">📁 Musik</div>
      <div class="tab" data-view="playlists">🎵 Playlists</div>
    </div>
    <div class="search-row">
      <input id="mb-search" type="search" placeholder="Suchen…" disabled>
    </div>
    <div class="tree-header" id="mb-header"></div>
    <div class="tree-list" id="mb-tree"></div>
  </div>
  <ul class="feed" id="feed"><li class="empty" id="feed-empty">Noch keine Aktivität</li></ul>
  <div class="forms">
    <form id="f-speak">
      <input id="in-speak" placeholder="Sprechen lassen, z.&nbsp;B.: Hallo, alles klar?">
      <button id="b-speak">Sagen</button>
      <div class="res" id="res-speak"></div>
    </form>
    <form id="f-intent">
      <input id="in-intent" placeholder="Intent testen, z.&nbsp;B.: Flurlampe an">
      <button id="b-intent">Absenden</button>
      <div class="res" id="res-intent"></div>
    </form>
    <div class="actions">
      <button id="b-listen" class="action-btn">🎤 Zuhören</button>
      <button id="b-stop" class="action-btn stop-btn">⏹ STOP</button>
    </div>
  </div>
</main>

<!-- ── Config Info Modal ──────────────────────────────────────── -->
<div id="config-modal">
  <div id="config-box">
    <h2>📋 Konfiguration (vom Master)</h2>
    <div id="config-loading">Lädt…</div>
    <table id="config-table" style="display:none"></table>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="close-btn" id="b-cfg-export" title="Konfiguration als JSON-Datei exportieren">⬇ Export</button>
      <button class="close-btn" id="b-cfg-import" title="Konfig-Datei (Master-/Satellite-Export) importieren">⬆ Import</button>
      <input type="file" id="cfg-import-file" accept="application/json,.json" hidden>
    </div>
    <div id="cfg-import-status" style="margin-top:6px"></div>
    <button class="close-btn" id="b-config-close">Schließen</button>
  </div>
</div>

<script>
const LABELS = {
  wake:       "Bereit",
  recording:  "Hört zu",
  processing: "Denkt nach",
  speaking:   "Spricht",
  followup:   "Folgefrage?"
};
const $ = id => document.getElementById(id);

function fmtUp(s) {
  s = Math.floor(s);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + (s%60) + "s";
  return Math.floor(s/3600) + "h " + Math.floor(s%3600/60) + "m";
}
function setStat(id, v) { $(id).textContent = v; }

// ── Config Info Modal ────────────────────────────────────────────
const $cfgModal = $("config-modal");
const $cfgLoading = $("config-loading");
const $cfgTable = $("config-table");

$("b-config-info").addEventListener("click", () => {
  $cfgModal.classList.add("open");
  $cfgLoading.style.display = "";
  $cfgTable.style.display = "none";
  loadConfigInfo();
});

$("b-config-close").addEventListener("click", () => {
  $cfgModal.classList.remove("open");
});

// ── Config Import / Export (Satellite) ────────────────────────
$("b-cfg-export").addEventListener("click", async () => {
  try {
    const r = await fetch("/config/export");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    let fname = "voice-satellite-config.json";
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="?([^";]+)"?/);
    if (m) fname = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    const st = $("cfg-import-status");
    st.textContent = "Export: " + fname;
    st.style.color = "var(--ok, #4c9)";
  } catch (e) {
    $("cfg-import-status").textContent = "Export fehlgeschlagen: " + e.message;
  }
});

$("b-cfg-import").addEventListener("click", () => {
  $("cfg-import-file").click();
});

$("cfg-import-file").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const st = $("cfg-import-status");
  try {
    const payload = JSON.parse(await file.text());
    const r = await fetch("/config/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    let msg = "Import: " + (j.applied || []).length + " Keys übernommen" +
      (j.ignored && j.ignored.length ? ", ignoriert: " + j.ignored.join(", ") : "");
    if (!j.pushed_to_master) msg += " – Master NICHT aktualisiert (unerreichbar oder offline)";
    st.textContent = msg;
    st.style.color = j.pushed_to_master ? "var(--ok, #4c9)" : "#e6a13b";
    loadConfigInfo();
  } catch (e) {
    st.textContent = "Import fehlgeschlagen: " + e.message;
    st.style.color = "var(--bad, #e55)";
  }
});

$cfgModal.addEventListener("click", (ev) => {
  if (ev.target === $cfgModal) $cfgModal.classList.remove("open");
});

async function loadConfigInfo() {
  try {
    const r = await fetch("/api/config/info");
    const j = await r.json();
    const cfg = j.config || {};
    $cfgLoading.style.display = "none";
    $cfgTable.style.display = "";
    // Master-URL und Config-Version zuerst
    let rows = "";
    const masterUrl = cfg["_master_url"];
    const configVer = cfg["_config_version"];
    if (masterUrl) {
      rows += `<tr><td>Master-URL</td><td>${escHtml(masterUrl)}</td></tr>`;
    }
    if (configVer) {
      rows += `<tr><td>Config-Version</td><td>v${escHtml(configVer)}</td></tr>`;
    }
    // Alle anderen Config-Keys sortiert auflisten
    const sorted = Object.keys(cfg).filter(k => !k.startsWith("_")).sort();
    for (const k of sorted) {
      const v = cfg[k];
      // Secret-Keys rot markieren
      const isSecret = k.includes("KEY") || k === "MEMORY_DB" || k === "SCHEDULE_FILE";
      const cls = isSecret ? " class=\"hidden-key\"" : "";
      const displayVal = isSecret ? "[vertrauliche Einstellung]" : (v || "–");
      rows += `<tr><td>${escHtml(k)}</td><td${cls}>${escHtml(displayVal)}</td></tr>`;
    }
    if (!rows) rows = "<tr><td colspan=\"2\">Keine Konfiguration verfügbar</td></tr>";
    $cfgTable.innerHTML = rows;
  } catch (e) {
    $cfgLoading.textContent = "Fehler: " + e.message;
  }
}

// maxSeq persistent speichern (localStorage) damit beim Reload
// keine Events übersprungen werden; das erste Snapshot baut den Feed
// komplett neu auf (seed) – die Logeinträge überleben so ein Neuladen.
let maxSeq = parseInt(localStorage.getItem("maxSeq") || "0", 10);
let seeded = false;

function makeLi(e) {
  const li = document.createElement("li");
  const t = document.createElement("time");
  t.textContent = e.ts;
  const m = document.createElement("span");
  m.textContent = e.msg;
  li.append(t, m);
  return li;
}

function addEvent(e) {
  if ((e.seq || 0) <= maxSeq) return;
  maxSeq = e.seq || 0;
  try { localStorage.setItem("maxSeq", String(maxSeq)); } catch(_) {}
  const empty = $("feed-empty");
  if (empty) empty.remove();
  const f = $("feed");
  f.prepend(makeLi(e));
  while (f.children.length > 200) f.lastChild.remove();
}

// Erstes Snapshot: Feed aus dem Server-Ring neu aufbauen (neueste oben).
function seedFeed(evts) {
  const f = $("feed");
  f.innerHTML = "";
  const empty = $("feed-empty");
  if (empty) empty.remove();
  let top = maxSeq;
  evts.slice().reverse().forEach(e => {
    f.prepend(makeLi(e));
    if ((e.seq || 0) > top) top = e.seq;
  });
  maxSeq = top;
  try { localStorage.setItem("maxSeq", String(maxSeq)); } catch(_) {}
}

function render(d) {
  const st = $("state");
  st.textContent = LABELS[d.state] || "Unbekannt";
  st.className = "badge " + (d.state || "") +
    (d.state === "processing" || d.state === "recording" || d.state === "speaking"
     ? " live" : "");
  if (d.version) $("ver").textContent = "v" + d.version;
  setStat("st-uptime", fmtUp(d.uptime_s || 0));
  const s = d.stats || {};
  setStat("st-wakes", s.wakes ?? 0);
  setStat("st-commands", s.commands ?? 0);
  setStat("st-llm", s.llm ?? 0);
  setStat("st-errors", s.errors ?? 0);
  renderMusic(d.music || {});
  renderIndex(d.index || {});
  renderVolume(d.volume);
  renderMicMute(d.mic_muted);
  renderMaster(d.master);
  const evts = d.events || [];
  const topEv = evts.length ? (evts[evts.length - 1].seq || 0) : 0;
  // Container-Neustart: Server-Seq ist zurueckgesprungen -> Dedupe neu starten
  if (seeded && topEv > 0 && topEv < maxSeq) { maxSeq = 0; seeded = false; }
  if (!seeded) {
    seeded = true;
    seedFeed(evts);   // Reload/Erstladung: Feed aus dem Server-Ring aufbauen
    return;
  }
  evts.forEach(addEvent);
}

function applyShuffleState(on) {
  const sh = $("b-music-shuffle");
  sh.classList.toggle("active", !!on);
  sh.textContent = on ? "🔀 Shuffle an" : "🔀 Shuffle";
  sh.title = on ? "Zufallswiedergabe ausschalten" : "Zufallswiedergabe einschalten";
}

function renderMusic(m) {
  const playing = !!m.playing, paused = !!m.paused;
  const title = m.title || (m.source === "radio" ? "Radio" : null);
  $("m-state").textContent = paused ? "Pausiert"
    : playing ? (m.source === "radio" ? "Radio läuft" : "Läuft")
    : m.pending ? "Gestartet" : "Musik";
  $("m-title").textContent = title || (paused || playing ? "–" : "Nichts abspielt");
  const active = playing || paused || m.pending;
  const toggle = $("b-music-toggle");
  const showPause = playing && !paused;
  toggle.style.display = active ? "" : "none";
  toggle.textContent = showPause ? "⏸ Pause" : "▶ Weiterspielen";
  toggle.title = showPause ? "Pause" : "Weiterspielen";
  // Shuffle: aktiven Zustand visuell markieren (hell) bzw. deaktiviert (dunkel).
  applyShuffleState(m.shuffle);
}

function renderVolume(v) {
  if (!v) return;
  const s = $("vol-slider"), p = $("vol-pct");
  s.value = v.volume;
  s.disabled = false;
  p.textContent = v.muted ? "stumm" : (v.volume + " %");
  p.className = "vol-pct" + (v.muted ? " muted" : "");
}

function renderMicMute(mic) {
  if (mic === undefined) return;
  const btn = $("b-mic-mute");
  if (!btn) return;
  btn.textContent = mic ? "🔇" : "🎤";
  btn.title = mic ? "Mikrofon freischalten" : "Mikrofon stummschalten";
  btn.classList.toggle("muted", mic);
}

// Master-Verbindung: leeres Object = Standalone (Badge ausblenden);
// sonst connected / lokal-fallback / getrennt – mit letztem OK im Titel.
function renderMaster(m) {
  const el = $("master");
  if (!el) return;
  if (!m || m.configured === false) { el.hidden = true; return; }
  el.hidden = false;
  el.classList.remove("master-ok", "master-fb", "master-off");
  const okT = m.last_ok ? " · OK " + m.last_ok.slice(11, 19) : "";
  if (m.connected) {
    el.classList.add("master-ok");
    el.textContent = "Master verbunden";
    el.title = "Verbunden mit Master-Container" + okT;
  } else if (m.source === "local_fallback") {
    el.classList.add("master-fb");
    el.textContent = "Master offline · lokal";
    el.title = "Master nicht erreichbar – lokaler Medien-Index aktiv" + okT;
  } else {
    el.classList.add("master-off");
    el.textContent = "Master getrennt";
    el.title = "Keine Verbindung zum Master-Container" +
      (m.failures ? " (" + m.failures + "× Fehlschlag)" : "") + okT;
  }
}

function renderIndex(ix) {
  // Header-Button: reiner Dateizähler (Quelle: Master, kein lokaler Build).
  const cnt = $("idx-count");
  if (cnt) cnt.textContent = (ix.files ?? "–");
  // Stats-Karten: aktueller Stand des Master-Index.
  $("st-index-files").textContent = (ix.files ?? "–");
  $("st-index-m3u").textContent = (ix.playlists ?? "–");
}

function connect() {
  const url = "/events" + (maxSeq ? "?since=" + encodeURIComponent(maxSeq) : "");
  const es = new EventSource(url);
  es.onopen = () => { $("conn").className = "dot on"; };
  es.onmessage = m => { try { render(JSON.parse(m.data)); } catch (e) {} };
  es.onerror = () => { $("conn").className = "dot off"; };
  return es;
}
connect();

// Display-Bild: alle 2 s neu laden (Server-Cache 1 s, Bild ändert sich selten)
const dispImg = $("disp-img"), dispNote = $("disp-note");
let dispUrl = null;
async function pollFrame() {
  try {
    const r = await fetch("/frame", { cache: "no-store" });
    if (!r.ok) {
      dispImg.style.display = "none";
      dispNote.style.display = "";
      return;
    }
    dispNote.style.display = "none";
    dispImg.style.display = "";
    const buf = await r.arrayBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: "image/png" }));
    if (dispUrl) URL.revokeObjectURL(dispUrl);  // vorheriges freigeben
    dispImg.src = url;
    dispUrl = url;
    $("disp-ts").textContent = new Date().toLocaleTimeString("de-DE");
  } catch (e) { /* Server kurz weg – ignorieren */ }
}
pollFrame();
setInterval(pollFrame, 2000);

async function post(path, text, resEl, btn) {
  btn.disabled = true;
  resEl.textContent = "\u2026";
  try {
    const j = await (await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    })).json();
    if (path === "/speak") {
      resEl.textContent = j.ok ? "gespielt (" + j.bytes + " Bytes)" : "Fehler: " + j.error;
    } else {
      resEl.textContent = j.route + " \u2192 " + j.answer;
    }
  } catch (e) {
    resEl.textContent = "Fehler: " + e;
  }
  btn.disabled = false;
}

$("f-speak").addEventListener("submit", ev => {
  ev.preventDefault();
  const t = $("in-speak").value.trim();
  if (t) post("/speak", t, $("res-speak"), $("b-speak"));
});
$("f-intent").addEventListener("submit", ev => {
  ev.preventDefault();
  const t = $("in-intent").value.trim();
  if (t) post("/intent", t, $("res-intent"), $("b-intent"));
});

async function musicBtn(path, body) {
  try {
    await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  } catch (e) { /* Zustand kommt per SSE von selbst */ }
}
$("b-music-stop").addEventListener("click", () => musicBtn("/stop"));
$("b-music-toggle").addEventListener("click", ev => {
  // Pause-Symbol sichtbar -> Pause, Play-Symbol -> Weiter
  musicBtn(ev.target.closest("button").title === "Pause" ? "/pause" : "/resume");
});
$("b-music-prev").addEventListener("click", () => musicBtn("/prev"));
$("b-music-next").addEventListener("click", () => musicBtn("/next"));
$("b-music-shuffle").addEventListener("click", () => {
  // Shuffle ist aktiv -> ausschalten, sonst einschalten.
  const enable = !$("b-music-shuffle").classList.contains("active");
  // Optimistischer Update: Button schaltet sofort um und wartet nicht auf
  // den naechsten SSE-Frame (der beim Index-Build stocken
  // koennte) — der Rahmen bestaetigt/korrigiert den Zustand von selbst.
  applyShuffleState(enable);
  musicBtn("/shuffle", { enable });
});

// „Neu indizieren“-Button entfernt: Der Master ist die einzige Index-Quelle.
// Der Header zeigt nur noch den Zähler des Master-Index als Badge.

// Zuhören-Button: startet manuelle Aufnahme
$("b-listen").addEventListener("click", async () => {
  const btn = $("b-listen");
  btn.disabled = true;
  btn.textContent = "⏳ ...";
  try {
    const r = await fetch("/listen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });
    const j = await r.json();
    btn.textContent = j.ok ? "✅ OK" : "❌ " + j.message;
    if (!j.ok) btn.textContent = "❌ " + j.message;
  } catch (e) {
    btn.textContent = "❌ Fehler";
  }
  setTimeout(() => { btn.textContent = "🎤 Zuhören"; btn.disabled = false; }, 3000);
});

// STOP-Button: bricht Pipeline ab (LLM/TTS stoppen, zurück zu wake)
$("b-stop").addEventListener("click", async () => {
  const btn = $("b-stop");
  btn.disabled = true;
  btn.textContent = "⏹ Stoppe...";
  try {
    await fetch("/stop_agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });
    btn.textContent = "✅ Gestoppt";
  } catch (e) {
    btn.textContent = "❌ Fehler";
  }
  setTimeout(() => { btn.textContent = "⏹ STOP"; btn.disabled = false; }, 2000);
});

// Lautstärkeregler: erst bei loslassen/loosen setzen (nicht beim Schieben)
let volBusy = false;
let volTimer = null;
$("vol-slider").addEventListener("input", ev => {
  volBusy = true;
  const p = ev.target.value + " %";
  $("vol-pct").textContent = p;
  $("vol-pct").className = "vol-pct";
  clearTimeout(volTimer);
  volTimer = setTimeout(() => {
    volBusy = false;
    fetch("/volume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ volume: Number(ev.target.value) })
    }).catch(() => { /* Zustand kommt per SSE von selbst */ });
  }, 400);
});

// Mic-Mute-Button: toggelt {muted: true|false}
$("b-mic-mute").addEventListener("click", async () => {
  const btn = $("b-mic-mute");
  const current = btn.classList.contains("muted");
  const muted = !current;  // gegen-toggeln
  btn.textContent = muted ? "🔇" : "🎤";
  btn.title = muted ? "Mikrofon freischalten" : "Mikrofon stummschalten";
  btn.classList.toggle("muted", muted);
  try {
    await fetch("/mic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ muted })
    }).catch(() => { /* Zustand kommt per SSE von selbst */ });
  } catch (e) { /* Fehler ignoriert, SSE korrigiert später */ }
});

// ── Media Browser ──────────────────────────────────────────────────
let mbView = "tree";     // "tree" | "playlists"
let mbPath = "";         // current tree prefix
let mbData = null;       // cached /api/music response
let mbSearchTimer = null;

const $mb = $("media-browser");
const $mbTree = $("mb-tree");
const $mbHeader = $("mb-header");
const $mbSearch = $("mb-search");
const $mbTitle = $("mb-title");

// Toggle visibility
$("b-media-toggle").addEventListener("click", () => {
  const vis = $mb.classList.toggle("visible");
  if (vis) {
    loadMediaIndex();
  }
});

// Tabs
document.querySelectorAll("#media-browser .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#media-browser .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    mbView = tab.dataset.view;
    $mbSearch.value = "";
    $mbSearch.disabled = true;
    mbPath = "";
    renderView();
  });
});

// Search
$mbSearch.addEventListener("input", () => {
  clearTimeout(mbSearchTimer);
  mbSearchTimer = setTimeout(doSearch, 400);
});

async function doSearch() {
  const q = $mbSearch.value.trim();
  if (!q) {
    $mbSearch.disabled = true;
    $mbHeader.innerHTML = "";
    $mbTree.innerHTML = "";
    return;
  }
  $mbSearch.disabled = false;
  try {
    const r = await fetch("/api/music/search?q=" + encodeURIComponent(q));
    const j = await r.json();
    renderSearchResults(j.results || []);
  } catch (e) {
    $mbTree.innerHTML = `<div class="empty">Fehler: ${e.message}</div>`;
  }
}

function renderSearchResults(results) {
  $mbHeader.innerHTML = `<span class="breadcrumb">Suche: „${escHtml($mbSearch.value)}"</span>`;
  if (!results.length) {
    $mbTree.innerHTML = '<div class="empty">Keine Treffer</div>';
    return;
  }
  $mbTree.innerHTML = results.map(r =>
    `<div class="tree-item file" onclick="playPath('${escAttr(r.path)}')">
      <span class="icon">🎵</span>
      <span class="name" title="${escHtml(r.name)}">${escHtml(r.name)}</span>
    </div>`
  ).join("");
}

// Load full index once
async function loadMediaIndex() {
  if (mbData) {
    renderView();
    return;
  }
  try {
    const r = await fetch("/api/music");
    mbData = await r.json();
    renderView();
  } catch (e) {
    $mbTree.innerHTML = `<div class="empty">Fehler: ${e.message}</div>`;
  }
}

function renderView() {
  if (!mbData) {
    $mbTree.innerHTML = '<div class="empty">Lädt…</div>';
    return;
  }
  if (mbView === "playlists") {
    renderPlaylists();
  } else {
    renderTree();
  }
}

function renderPlaylists() {
  const pls = mbData.playlists || [];
  $mbTitle.textContent = `Playlists (${pls.length})`;
  $mbHeader.innerHTML = "";
  if (!pls.length) {
    $mbTree.innerHTML = '<div class="empty">Keine Playlists gefunden</div>';
    return;
  }
  $mbTree.innerHTML = pls.map(p =>
    `<div class="tree-item dir" onclick="playPath('${escAttr(p)}')">
      <span class="icon">🎵</span>
      <span class="name" title="${escHtml(p)}">${escHtml(p)}</span>
    </div>`
  ).join("");
}

function renderTree() {
  $mbTitle.textContent = `Musik`;
  if (!mbPath) {
    $mbHeader.innerHTML = "";
  } else {
    const parts = mbPath.split("/").filter(Boolean);
    let bc = '<span class="breadcrumb">🏠';
    let cur = "";
    parts.forEach((p, i) => {
      cur += p + "/";
      const isLast = i === parts.length - 1;
      bc += ` <span ${!isLast ? `onclick="navigateTo('${escAttr(cur)}')"` : ''}>${escHtml(p)}</span>`;
    });
    bc += "</span>";
    $mbHeader.innerHTML = bc;
  }
  fetchTree(mbPath);
}

async function fetchTree(prefix) {
  try {
    const r = await fetch("/api/music/tree?prefix=" + encodeURIComponent(prefix));
    const j = await r.json();
    renderTreeData(j);
  } catch (e) {
    $mbTree.innerHTML = `<div class="empty">Fehler: ${e.message}</div>`;
  }
}

function renderTreeData(data) {
  const dirs = data.dirs || [];
  const files = data.files || [];
  let html = "";

  // Dirs zuerst, sortiert
  dirs.forEach(d => {
    html += `<div class="tree-item dir" onclick="navigateTo('${escAttr(d.path)}')">
      <span class="icon">📁</span>
      <span class="name">${escHtml(d.name)}</span>
      <span class="count">${d.count}</span>
    </div>`;
  });

  // Audio-Dateien, sortiert
  files.forEach(f => {
    html += `<div class="tree-item file" onclick="playPath('${escAttr(f.path)}')">
      <span class="icon">🎵</span>
      <span class="name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
      <span class="count">${escHtml(f.ext)}</span>
    </div>`;
  });

  if (!html) {
    html = '<div class="empty">Leer</div>';
  }
  $mbTree.innerHTML = html;
}

// Breadcrumb navigation
function navigateTo(path) {
  mbPath = path;
  $mbSearch.value = "";
  $mbSearch.disabled = true;
  renderTree();
}

// Play helper
function playPath(path) {
  const isMp3 = path.endsWith(".mp3") || path.endsWith(".m4a") || path.endsWith(".ogg") ||
                path.endsWith(".flac") || path.endsWith(".opus") || path.endsWith(".wav");
  if (isMp3) {
    fetch("/music/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path })
    }).catch(() => {});
  } else {
    // Playlist
    fetch("/music/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path })
    }).catch(() => {});
  }
}

// Escape helpers
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(s) {
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}
</script>
