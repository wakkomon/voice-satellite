<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice-Satellite · Chat</title>
<style>
:root { --bg:#12141a; --card:#1c1f28; --fg:#e8eaf0; --dim:#8b90a0; --acc:#4fa3ff; --ok:#3ecf8e; --warn:#f0a03c; --err:#f0605a; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
#login-overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:2000; }
#login-overlay[hidden] { display:none; }
.login-box { background:var(--card); border:1px solid #2c3040; border-radius:12px; padding:26px 30px; width:340px; }
.login-box h2 { margin:0 0 4px; font-size:1.1rem; }
.login-box .hint { color:var(--dim); font-size:0.8rem; margin-bottom:16px; }
.login-box input { width:100%; background:#0d0f14; border:1px solid #2a2e3a; color:var(--fg); padding:9px 12px; border-radius:6px; font-size:0.9rem; margin-bottom:10px; }
.login-box input:focus { outline:none; border-color:var(--acc); }
.login-box .err { color:var(--err); font-size:0.8rem; min-height:1.2em; margin-top:8px; }
.login-box button { width:100%; padding:9px; font-size:0.92rem; }
.userchip { display:inline-block; font-size:0.72rem; font-weight:600; padding:2px 10px; border-radius:20px; background:#262a35; color:var(--acc); margin-left:10px; }
.userchip.admin { background:#173328; color:var(--ok); }
.userchip.user { color:var(--dim); }
header { padding:18px 24px 14px; border-bottom:1px solid #2a2e3a; }
.backbtn { padding:6px 14px;border:1px solid var(--dim);background:transparent;border-radius:6px;cursor:pointer;color:var(--acc);font-size:0.85rem; }
h1 { font-size:1.15rem; font-weight:600; margin:0; display:flex; align-items:center; gap:10px; }
h1 a { color:var(--dim); font-size:0.85rem; font-weight:400; text-decoration:none; }
h1 .v { color:var(--dim); font-size:0.8rem; font-weight:400; margin-left:auto; }
.controls { display:flex; gap:8px; align-items:center; padding:10px 20px; border-bottom:1px solid #2a2e3a; flex-wrap:wrap; }
.controls select, .controls input[type=checkbox] { background:#0d0f14; border:1px solid #2a2e3a; color:var(--fg); padding:5px 8px; border-radius:6px; font-size:0.85rem; }
.controls label { color:var(--dim); font-size:0.82rem; display:flex; align-items:center; gap:6px; }
.clabel { color:var(--dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; }
.chat { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:78%; padding:8px 12px; border-radius:12px; font-size:0.92rem; line-height:1.35; background:var(--card); position:relative; }
.msg .who { display:block; margin-bottom:4px; }
.msg .time { font-size:0.68rem; color:var(--dim); margin-top:4px; text-align:right; }
.msg.user { align-self:flex-end; background:#1d3a5c; border-bottom-right-radius:4px; }
.msg.assistant { align-self:flex-start; border-bottom-left-radius:4px; }
.msg.musik { align-self:flex-start; border-left:3px solid var(--ok); border-bottom-left-radius:4px; }
.msg.system { align-self:center; background:transparent; color:var(--dim); font-size:0.78rem; }
.badge { display:inline-block; font-size:0.68rem; padding:1px 7px; border-radius:8px; background:#0d0f14; border:1px solid #2a2e3a; color:var(--dim); }
.badge.in { border-color:#2a5a8a; color:#8ec5ff; }
.badge.out { border-color:#2f7a52; color:#7ee0b0; }
.badge.mus { border-color:#5a4a2a; color:#f0c47a; }
.msg .play { margin-top:6px; display:flex; gap:6px; align-items:center; }
.msg .play button { background:var(--acc); color:#fff; border:none; border-radius:6px; padding:4px 12px; font-size:0.75rem; cursor:pointer; }
.msg .play button.stop { background:var(--err); }
.msg .play span { font-size:0.75rem; color:var(--dim); }
.msg .think { margin:2px 0 6px; font-size:0.78rem; }
.msg .think summary { color:var(--dim); cursor:pointer; user-select:none; }
.msg .think pre { white-space:pre-wrap; word-break:break-word; color:var(--dim);
  font-family:inherit; margin:6px 0 0; border-left:2px solid #2a2e3a; padding-left:8px; }
.msg.streaming .body::after { content:"\258C"; color:var(--acc); animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.inputbar { display:flex; gap:8px; padding:12px 20px; border-top:1px solid #2a2e3a; }
.inputbar input { flex:1; background:#0d0f14; border:1px solid #2a2e3a; color:var(--fg); padding:10px 14px; border-radius:8px; font-size:0.95rem; }
.inputbar input:focus { outline:none; border-color:var(--acc); }
.inputbar button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:8px 20px; font-size:0.9rem; cursor:pointer; }
.inputbar button:disabled { opacity:0.4; cursor:default; }
#btn-mic { padding:8px 12px; background:#0d0f14; border:1px solid var(--acc); color:var(--acc); font-size:1rem; }
#btn-mic.recording { background:var(--err); border-color:var(--err); color:#fff; animation:recpulse 1.2s ease-in-out infinite; }
@keyframes recpulse { 0%,100% { box-shadow:0 0 0 0 rgba(240,96,90,.5); } 50% { box-shadow:0 0 0 7px rgba(240,96,90,0); } }
.empty { color:var(--dim); text-align:center; margin-top:40px; font-size:0.9rem; }
</style>
</head>
<body>
<div id="login-overlay" hidden>
  <div class="login-box">
    <h2 id="login-title">Chat</h2>
    <div class="hint" id="login-hint">Bitte anmelden, um den Chat zu nutzen.</div>
    <input id="login-user" placeholder="Benutzername" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Passwort" autocomplete="current-password">
    <button id="login-btn">Anmelden</button>
    <div class="err" id="login-err"></div>
  </div>
</div>
<header>
  <h1><button class="backbtn" onclick="location.href='/'">← Zurück</button>💬 Chat
    <span class="userchip" id="user-chip" style="display:none"></span>
    <a id="btn-logout" href="#" style="display:none;font-size:0.8rem;color:var(--dim);margin-left:6px">Abmelden</a>
    <span class="v" id="status">verbinde …</span></h1>
</header>
<div class="controls">
  <span class="clabel">Chat filtern</span>
  <select id="sat-select" onchange="switchSat()"><option value="">Alle Geräte</option></select>
  <span class="clabel" style="margin-left:6px">Abspielen auf</span>
  <select id="out-select"><option value="browser">🖥 Browser</option><option value="all">📢📢 Alle Geräte</option></select>
  <label style="margin-left:6px"><input type="checkbox" id="speak-toggle" checked> Antwort abspielen</label>
  <label style="margin-left:auto"><span id="rec-info" class="num" style="color:var(--dim);font-size:0.78rem"></span></label>
</div>
<div class="chat" id="chat"></div>
<div class="inputbar">
  <input id="chat-input" placeholder="Nachricht an den Assistenten …" autocomplete="off">
  <button id="btn-mic" type="button" title="Sprache aufnehmen (Mikrofon)" onclick="toggleRec()">🎤</button>
  <button id="btn-send" onclick="sendMsg()">Senden</button>
</div>

<script>
const $ = id => document.getElementById(id);
let mac = localStorage.getItem("chat_mac") || "";
let lastTs = 0;
const audio = new Audio();
let audioBusy = null;
const SATNAMES = {}; // mac -> Anzeigename (aus /api/satellites)

// ── Namen ─────────────────────────────────────────────────────
function nameOf(m) {
  if (!m) return "?";
  if (m === "web") return "Web-Chat";
  if (m === "all") return "Alle Geräte";
  return SATNAMES[m] || m;
}

// ── Aufnahme-Wiedergabe: Key berechnet der Master (/api/chat/recq).
// Der WebUI-Hashing-Weg (crypto.subtle) steht auf HTTP-LAN-IPs nicht zur
// Verfuegung (insecure context) -> silent failure; deshalb Serverschluessel. ──
function recUrl(text) { return "/api/chat/recq?text=" + encodeURIComponent(text); }
function resetBtn(btn) {
  if (!btn) return;
  if (audioBusy === btn) { audioBusy.classList.remove("stop"); audioBusy.textContent = "▶ Abspielen"; audioBusy = null; }
}
function stopAudio() {
  audio.pause(); audio.src = "";
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch {} }
  resetBtn(audioBusy);
}
function stopAudioKeepBtn() { audio.pause(); audio.src = ""; }

async function playRec(text, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  audio.src = recUrl(text);
  audio.onended = stopAudio;
  audio.onerror = stopAudio;
  btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
  audioBusy = btn;
  audio.play().catch(stopAudio);
}
function playUrl(url, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  audio.src = url;
  audio.onended = stopAudio;
  audio.onerror = stopAudio;
  btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
  audioBusy = btn;
  audio.play().catch(stopAudio);
}
function musicUrl(path) {
  if (!path) return null;
  if (/^https?:\/\//.test(path)) return path;
  return "/proxy/music/" + path.replace(/^\/+/, "");
}

// ── Abspielen: Browser (Aufnahme sonst Browser-TTS) oder PI ────
// Browser: zuerst die TTS-Aufnahme vom Master (Web-Chat-Antworten haben eine),
// sonst Browser-TTS (Satelliten-Antworten haben keine Aufnahme).
async function playBrowser(text, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  const r = await fetch(recUrl(text)).catch(() => null);
  if (r && r.ok) {
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    audio.src = u;
    audio.onended = () => { stopAudio(); URL.revokeObjectURL(u); };
    audio.onerror = () => { stopAudio(); URL.revokeObjectURL(u); };
    btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
    audioBusy = btn;
    audio.play().catch(stopAudio);
  } else {
    speakSynth(text, btn);
  }
}
function speakSynth(text, btn) {
  if (!("speechSynthesis" in window)) { $("status").textContent = "Browser-TTS nicht verfügbar"; return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if (btn) {
    btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
    audioBusy = btn;
    u.onend = u.onerror = () => { if (audioBusy === btn) { resetBtn(btn); } };
  }
  window.speechSynthesis.speak(u);
}
async function broadcastTo(satMac, text, btn) {
  // PI / anderes Gerät: Text an den Satelliten -> dort TTS + Lautsprecher
  // (POST /api/broadcast -> /speak). wait=false -> sofort zurück, TTS läuft
  // auf dem Gerät im Hintergrund.
  if (btn) { btn.classList.add("stop"); btn.textContent = "… Sende"; }
  $("status").textContent = "→ " + nameOf(satMac);
  try {
    const r = await fetch("/api/broadcast", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ sat: satMac, text: text, wait: false })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok === false) $("status").textContent = d.error || "Sende fehlgeschlagen (" + r.status + ")";
  } catch (e) {
    $("status").textContent = "Sende-Fehler";
  }
  // audioBusy wird in diesem Pfad nie gesetzt -> nicht daran festmachen;
  // Button zuruecksetzen, solange er noch im Sende-Zustand ist.
  setTimeout(() => {
    if (btn && btn.textContent === "… Sende") {
      btn.classList.remove("stop");
      btn.textContent = "▶ Abspielen";
    }
  }, 3500);
}
// Eintrag abspielen – Zielgerät = aktueller "Abspielen auf"-Auswahlwert.
function speakOut(entry, btn) {
  const out = $("out-select").value;
  const text = (entry.text || "").trim();
  if (!text) return;
  if (out === "browser") playBrowser(text, btn);
  else broadcastTo(out, text, btn);
}

// ── Rendering ─────────────────────────────────────────────────
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}) +
         " " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function renderEntry(e) {
  const div = document.createElement("div");
  const kind = e.kind || "system";
  const dev = e.mac || "";
  const devname = nameOf(e.mac);
  div.className = "msg " + kind;
  let who = "", playHtml = "", body = esc(e.text), thinkHtml = "";
  if (e.think) {
    thinkHtml = `<details class="think"><summary>💭 Thinking (${e.think.length} Zeichen)</summary><pre>${esc(e.think)}</pre></details>`;
  }
  // Quelle (e.who): schreibender Web-UI-Benutzer (Benutzerverwaltung) oder
  // "web" bei älteren Einträgen — bei "web" unsichtbar (Alt-Verhalten).
  const whoSrc = (e.who && e.who !== "web") ? ` · 👤 ${esc(e.who)}` : "";
  if (kind === "user") {
    // Eingabe -> Quellgerät (wo es erkannt wurde) + wer es geschrieben hat
    who = `<span class="badge in">🎤 ${esc(devname)}${whoSrc}</span>`;
    // Eingabe ist nur Erkanntes, keine Audio-Ausgabe -> kein Abspiel-Button.
    playHtml = "";
  } else if (kind === "assistant") {
    // Ausgabe -> echtes Zielgerät (wo die Antwort gesprochen wird), nicht das
    // Eingabegerät. e.out = 'browser' | Satellit-Key; 📢 = an Gerät gebroadcastt.
    const tgt = e.out || e.mac;
    const bcast = e.out && e.out !== "browser";
    who = `<span class="badge out">${bcast ? "🔊📢" : "🔊"} ${esc(nameOf(tgt))}${bcast ? " · Broadcast" : ""}${whoSrc}</span>`;
    playHtml = `<div class="play"><button>▶ Abspielen</button><span>Ausgabe</span></div>`;
  } else if (kind === "musik") {
    who = `<span class="badge mus">🎵 ${esc(devname)}</span>`;
    const url = musicUrl(e.path);
    playHtml = url ? `<div class="play"><button>▶ Wiedergabe</button></div>` : "";
  } else {
    who = `<span class="badge">${esc(devname || "System")}</span>`;
  }
  div.innerHTML = `<span class="who">${who}</span>${thinkHtml}<div class="body">${body}</div>${playHtml}<div class="time">${fmtTime(e.ts)}</div>`;
  const btn = div.querySelector(".play button");
  if (btn) {
    if (kind === "musik") btn.onclick = () => playUrl(musicUrl(e.path), btn);
    else btn.onclick = () => speakOut(e, btn);
  }
  return div;
}

// Dedup: gleiche (kind,mac,text)-Eintraege nicht doppelt rendern
const seen = new Set();
const ekey = e => (e.kind || "system") + "|" + (e.mac || "") + "|" + (e.text || "");

async function loadEntries() {
  const q = mac ? "?mac=" + encodeURIComponent(mac) + "&limit=200" : "?limit=200";
  const r = await fetch("/api/chat/messages" + q);
  if (!r.ok) { $("status").textContent = "Fehler " + r.status; return; }
  const data = await r.json();
  $("status").textContent = "";
  const chat = $("chat");
  const entries = data.entries || [];
  const prevTs = lastTs;
  lastTs = Math.max(lastTs, ...(entries.map(e => e.ts) || [0]));
  if (prevTs === 0) {
    chat.innerHTML = "";
    seen.clear();
    if (!entries.length) {
      chat.innerHTML = '<div class="empty">Noch keine Einträge.<br>Sprech-Turne (Eingabe/Ausgabe) und Musik erscheinen hier.</div>';
      return;
    }
    // API liefert neueste zuerst — fuer Chat-Ansicht (neueste unten) umdrehen
    for (const e of [...entries].reverse())
      if (!seen.has(ekey(e))) { seen.add(ekey(e)); chat.appendChild(renderEntry(e)); }
    chat.scrollTop = chat.scrollHeight;
    return;
  }
  // Inkrementell: nur neue Eintraege, chronologisch aufsteigend, ans Ende haengen
  const newE = entries.filter(e => e.ts > prevTs).sort((a, b) => a.ts - b.ts);
  if (newE.length) {
    for (const e of newE)
      if (!seen.has(ekey(e))) { seen.add(ekey(e)); chat.appendChild(renderEntry(e)); }
    chat.scrollTop = chat.scrollHeight;
  }
  $("status").textContent = "";
}

// ── Spracheingabe: Mikrofon-Aufnahme → Whisper-Transkript → Chat ──
// Browser-Aufnahme: Web Audio (Float32) → 16 kHz / 16 bit mono WAV. WebM/Opus
// geht NICHT — der Whisper.cpp-Server am Master versteht nur WAV (wie der
// Satellit, s. app/stt.py). Danach POST an /api/chat/transcribe (Session-
// Cookie, kein Bearer-Token nötig); der Master füllt Modell/Sprache aus der
// zentralen Config, sodass Web-Chat und Pi identische STT-Einstellungen nutzen.
let rec = null; // { ctx, stream, proc, sink, chunks, rate }
function micAvailable() {
  return !!(window.isSecureContext && navigator.mediaDevices
           && navigator.mediaDevices.getUserMedia);
}
function setMicStatus(txt) { $("status").textContent = txt || ""; }
async function toggleRec() {
  if (rec) { stopRec(); return; }
  if (!micAvailable()) { setMicStatus("Mikro nicht verfügbar (HTTPS erforderlich)"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true } });
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    if (ctx.state === "suspended") await ctx.resume().catch(() => {});
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const sink = ctx.createGain(); sink.gain.value = 0; // Feedback unterbinden
    const chunks = [];
    proc.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(d)); // Kopie — Buffer wird wiederverwendet
    };
    src.connect(proc); proc.connect(sink); sink.connect(ctx.destination);
    rec = { ctx, stream, proc, sink, chunks, rate: ctx.sampleRate };
    $("btn-mic").classList.add("recording");
    $("btn-mic").textContent = "⏹";
    setMicStatus("🎙 Aufnahme läuft — zum Stoppen erneut tippen …");
  } catch (e) {
    rec = null;
    setMicStatus("Mikro-Zugriff verweigert");
  }
}
function stopRec() {
  if (!rec) return;
  const { stream, proc, sink, chunks, ctx, rate } = rec;
  rec = null;
  $("btn-mic").classList.remove("recording");
  $("btn-mic").textContent = "🎤";
  try { stream.getTracks().forEach(t => t.stop()); } catch {}
  try { proc.disconnect(); sink.disconnect(); ctx.close(); } catch {}
  const n = chunks.reduce((a, c) => a + c.length, 0);
  if (n === 0 || n / rate < 0.4) { setMicStatus("Aufnahme zu kurz"); return; }
  const pcm = new Float32Array(n);
  let off = 0; for (const c of chunks) { pcm.set(c, off); off += c.length; }
  setMicStatus("🔤 Sprache wird erkannt …");
  transcribeWav(wav16(resample(pcm, rate, 16000), 16000));
}
function resample(buf, inRate, outRate) {
  if (outRate === inRate) return buf;
  const ratio = inRate / outRate;
  const out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const idx = i * ratio, i0 = Math.floor(idx), i1 = Math.min(i0 + 1, buf.length - 1);
    out[i] = buf[i0] * (1 - (idx - i0)) + buf[i1] * (idx - i0);
  }
  return out;
}
function wav16(float, rate) {
  const n = float.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const W = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  W(0, "RIFF"); dv.setUint32(4, 36 + n * 2, true); W(8, "WAVE"); W(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); W(36, "data");
  dv.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, float[i])); dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2; }
  return new Uint8Array(buf);
}
async function transcribeWav(wav) {
  try {
    const r = await fetch("/api/chat/transcribe", {
      method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) { setMicStatus("Erkennen fehlgeschlagen: " + (d.error || r.status)); return; }
    const text = (d.text || "").trim();
    if (!text) { setMicStatus("Nichts verstanden"); return; }
    $("chat-input").value = text;   // erkannten Text in die Zeile, dann senden
    sendMsg();
  } catch (e) {
    setMicStatus("Erkennungs-Fehler");
  }
}

// ── Web-Chat senden ───────────────────────────────────────────
async function sendMsg() {
  const text = $("chat-input").value.trim();
  if (!text) return;
  $("chat-input").value = "";
  $("btn-send").disabled = true;
  $("status").textContent = "verarbeite …";
  // optimistic user entry (Quellgerät = Web-Chat, Zielgerät folgt aus Antwort)
  const rid = Math.random().toString(16).slice(2, 10);
  const mine = { kind:"user", text, ts: Date.now()/1000, mac: mac || "web" };
  const div = renderEntry(mine);
  seen.add(ekey(mine));
  $("chat").appendChild(div);
  try {
    const r = await fetch("/api/chat/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text, mac, speak: $("speak-toggle").checked,
                             out: $("out-select").value, rid })
    });
    const data = await r.json();
    if (r.ok && data.answer) {
      const outTgt = data.out || $("out-select").value;
      const a = { kind:"assistant", text: data.answer, ts: data.ts || Date.now()/1000, mac: mac || "web", out: outTgt };
      // Antwort evtl. schon per SSE-Event 'answer' gerendert -> Dedup beachten.
      if (!seen.has(ekey(a))) {
        seen.add(ekey(a));
        $("chat").appendChild(renderEntry(a));
        $("chat").scrollTop = $("chat").scrollHeight;
      }
      if (data.broadcast === "started")
        $("status").textContent = "Antwort an " + nameOf(outTgt) + " gebroadcastet";
      // SSE-'answer' koehte fehlgeschlagen sein -> Live-Div aus Antwort fuellen
      if (live && live.rid === rid) {
        live.entry = { kind:"assistant", text: data.answer, ts: data.ts || Date.now()/1000,
                       mac: mac || "web", out: outTgt, think: live.entry.think || "" };
        if (!seen.has(ekey(live.entry))) { seen.add(ekey(live.entry)); lastTs = Math.max(lastTs, live.entry.ts); }
        live.div.replaceWith(renderEntry(live.entry));
        live = null;
      }
    } else {
      $("status").textContent = data.error || "Fehler " + r.status;
    }
  } catch (e) {
    $("status").textContent = "Verbindung fehlgeschlagen";
  }
  $("btn-send").disabled = false;
}

// ── Geräte-Liste: befüllt beide Auswahlfelder + Namenstabelle ──
async function loadSats() {
  const r = await fetch("/api/satellites");
  if (!r.ok) return;
  const sats = await r.json();
  const filt = $("sat-select");
  const out = $("out-select");
  for (const s of sats) {
    const label = s.custom_name || s.name || s.hostname || s.mac;
    SATNAMES[s.mac] = label;
    const o1 = document.createElement("option");
    o1.value = s.mac; o1.textContent = label;
    filt.appendChild(o1);
    const o2 = document.createElement("option");
    o2.value = s.mac; o2.textContent = "📢 " + label;
    out.appendChild(o2);
  }
  if (mac) filt.value = mac;
}
function switchSat() {
  mac = $("sat-select").value;
  localStorage.setItem("chat_mac", mac);
  if (live) { live = null; }
  seen.clear();
  lastTs = 0;
  $("chat").innerHTML = "";
  loadEntries();
}

// ── Chat-Status: der Master meldet Verarbeitungsphasen per SSE (/events).
// thinking -> answer (Antwort schon anzeigen, bevor TTS laeuft) -> tts -> done.
const PHASE_TXT = { thinking: "🧠 denkt nach …", stream: "✍️ Antwort trifft ein …", tts: "🔊 Audio wird erzeugt …", done: "" };
const sse = new EventSource("/events");
// Live-Streaming: 'stream'-Events enthalten kumuliert think+answer bis zum
// fertigen 'answer'-Event. live = { rid, div, entry } des eigenen Streams.
let live = null;
function updateLive() {
  const div = live.div;
  const body = div.querySelector(".body");
  if (body) body.innerHTML = esc(live.entry.text);
  let th = div.querySelector(".think");
  if (live.entry.think) {
    if (!th) {
      th = document.createElement("details");
      th.className = "think";
      th.innerHTML = "<summary>💭 Thinking</summary><pre></pre>";
      div.insertBefore(th, body);
    }
    th.querySelector("summary").textContent = "💭 Thinking (" + live.entry.think.length + " Zeichen)";
    th.querySelector("pre").textContent = live.entry.think;
  } else if (th) th.remove();
  $("chat").scrollTop = $("chat").scrollHeight;
}
sse.addEventListener("chat_progress", ev => {
  let d; try { d = (JSON.parse(ev.data) || {}).data || {}; } catch { return; }
  if (d.state in PHASE_TXT) $("status").textContent = PHASE_TXT[d.state];
  if (d.state === "stream") {
    if (live && d.rid && d.rid !== live.rid) return; // fremde laufende Anfrage
    if (!live) {
      const e = { kind: "assistant", text: d.answer || "", ts: Date.now() / 1000,
                  mac: d.mac || "web", out: d.out, think: d.think || "" };
      const div = renderEntry(e);
      div.classList.add("streaming");
      live = { rid: d.rid || "", div, entry: e };
      $("chat").appendChild(div);
    } else {
      live.entry.text = d.answer || live.entry.text;
      live.entry.think = d.think || live.entry.think;
      updateLive();
    }
    $("chat").scrollTop = $("chat").scrollHeight;
  }
  if (d.state === "answer" && d.answer) {
    if (live && d.rid && d.rid !== live.rid) { live.div.remove(); live = null; }
    const e = { kind: "assistant", text: d.answer, ts: d.ts || Date.now() / 1000,
                mac: d.mac || "web", out: d.out, think: d.think || "" };
    if (live) {
      // Live-Div wird final ersetzt (feste Zeit, Play-Button, Think-Block)
      live.div.remove();
      live = null;
      seen.add(ekey(e));
      lastTs = Math.max(lastTs, e.ts);
      $("chat").appendChild(renderEntry(e));
    } else if (!seen.has(ekey(e))) {
      seen.add(ekey(e));
      $("chat").appendChild(renderEntry(e));
      lastTs = Math.max(lastTs, e.ts);
    }
    $("chat").scrollTop = $("chat").scrollHeight;
  }
  if (d.state === "done" && live) { live.div.classList.remove("streaming"); }
});

$("chat-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

// ── Benutzerverwaltung: Login vor Chat-Start ──────────────────
let SETUP_MODE = false;     // true = Store leer -> Formular legt Admin an
function showLogin(needsSetup, msg) {
  SETUP_MODE = !!needsSetup;
  document.body.style.overflow = "hidden";
  $("login-overlay").hidden = false;
  if (needsSetup) {
    $("login-title").textContent = "Ersteinrichtung";
    $("login-hint").textContent = "Noch kein Benutzerkonto vorhanden — bitte das erste Admin-Konto anlegen:";
    $("login-btn").textContent = "Admin-Konto anlegen";
  } else {
    $("login-title").textContent = "Chat";
    $("login-hint").textContent = "Bitte anmelden, um den Chat zu nutzen.";
    $("login-btn").textContent = "Anmelden";
  }
  $("login-err").textContent = msg || "";
}
async function doLogin() {
  const u = $("login-user").value.trim();
  const pw = $("login-pass").value;
  if (!u || !pw) { $("login-err").textContent = "Name und Passwort eingeben."; return; }
  $("login-btn").disabled = true;
  $("login-err").textContent = "";
  // SETUP_MODE entscheidet: leerer Store -> /api/setup (legt Admin an), sonst /login.
  const url = SETUP_MODE ? "/api/setup" : "/login";
  try {
    const r = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: pw }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { enter(j); $("login-btn").disabled = false; return; }
    if (SETUP_MODE && /abgeschlossen/i.test(j.error || "")) {
      showLogin(false, "Es existieren bereits Konten — bitte anmelden."); return;
    }
    if (!SETUP_MODE) {
      // Store inzwischen leer (z.B. Reset) -> auf Setup umbiegen
      const st = await fetch("/api/auth/status").then(x => x.json()).catch(() => ({}));
      if (st.has_users === false) { showLogin(true, "Noch kein Konto — bitte erstes Admin-Konto anlegen."); return; }
    }
    $("login-err").textContent = j.error || (SETUP_MODE ? "Einrichtung fehlgeschlagen." : "Anmeldung fehlgeschlagen.");
  } catch (e) { $("login-err").textContent = "Verbindung fehlgeschlagen: " + e; }
  $("login-btn").disabled = false;
}
function enter(user) {
  const chip = $("user-chip");
  chip.textContent = (user.display || user.username || "") +
    (user.role === "admin" ? " · admin" : " · user");
  chip.className = "userchip " + (user.role === "admin" ? "admin" : "user");
  chip.style.display = "inline-block";
  $("btn-logout").style.display = "inline";
  $("login-overlay").hidden = true;
  document.body.style.overflow = "";
  loadSats();
  loadEntries();
  setInterval(() => { if (!$("btn-send").disabled) loadEntries(); }, 10000);
}
$("login-btn").onclick = doLogin;
$("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("btn-logout").onclick = e => {
  e.preventDefault();
  fetch("/logout", { method: "POST" }).finally(() => location.reload());
};
fetch("/api/me").then(r => r.json().then(j => {
  if (r.ok) enter(j);
  else showLogin(!!j.needs_setup, "");
})).catch(() => showLogin(false, "Master nicht erreichbar."));
// Aufnahme-Liste (Info-Zeile)
(async () => {
  try {
    const r = await fetch("/api/chat/recs");
    const d = await r.json();
    $("rec-info").textContent = (d.recs || []).length + " TTS-Aufnahmen";
  } catch {}
})();
</script>
