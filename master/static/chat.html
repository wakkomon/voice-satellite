<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice-Satellite · Chat</title>
<style>
:root { --bg:#12141a; --card:#1c1f28; --fg:#e8eaf0; --dim:#8b90a0; --acc:#4fa3ff; --ok:#3ecf8e; --warn:#f0a03c; --err:#f0605a; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
header { padding:14px 20px 10px; border-bottom:1px solid #2a2e3a; }
h1 { font-size:1.15rem; font-weight:600; margin:0; display:flex; align-items:center; gap:10px; }
h1 a { color:var(--dim); font-size:0.85rem; font-weight:400; text-decoration:none; }
h1 .v { color:var(--dim); font-size:0.8rem; font-weight:400; margin-left:auto; }
.controls { display:flex; gap:8px; align-items:center; padding:10px 20px; border-bottom:1px solid #2a2e3a; flex-wrap:wrap; }
.controls select, .controls input[type=checkbox] { background:#0d0f14; border:1px solid #2a2e3a; color:var(--fg); padding:5px 8px; border-radius:6px; font-size:0.85rem; }
.controls label { color:var(--dim); font-size:0.82rem; display:flex; align-items:center; gap:6px; }
.clabel { color:var(--dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; }
.chat { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:78%; padding:8px 12px; border-radius:12px; font-size:0.92rem; line-height:1.35; background:var(--card); position:relative; }
.msg .who { display:block; margin-bottom:4px; }
.msg .time { font-size:0.68rem; color:var(--dim); margin-top:4px; text-align:right; }
.msg.user { align-self:flex-end; background:#1d3a5c; border-bottom-right-radius:4px; }
.msg.assistant { align-self:flex-start; border-bottom-left-radius:4px; }
.msg.musik { align-self:flex-start; border-left:3px solid var(--ok); border-bottom-left-radius:4px; }
.msg.system { align-self:center; background:transparent; color:var(--dim); font-size:0.78rem; }
.badge { display:inline-block; font-size:0.68rem; padding:1px 7px; border-radius:8px; background:#0d0f14; border:1px solid #2a2e3a; color:var(--dim); }
.badge.in { border-color:#2a5a8a; color:#8ec5ff; }
.badge.out { border-color:#2f7a52; color:#7ee0b0; }
.badge.mus { border-color:#5a4a2a; color:#f0c47a; }
.msg .play { margin-top:6px; display:flex; gap:6px; align-items:center; }
.msg .play button { background:var(--acc); color:#fff; border:none; border-radius:6px; padding:4px 12px; font-size:0.75rem; cursor:pointer; }
.msg .play button.stop { background:var(--err); }
.msg .play span { font-size:0.75rem; color:var(--dim); }
.inputbar { display:flex; gap:8px; padding:12px 20px; border-top:1px solid #2a2e3a; }
.inputbar input { flex:1; background:#0d0f14; border:1px solid #2a2e3a; color:var(--fg); padding:10px 14px; border-radius:8px; font-size:0.95rem; }
.inputbar input:focus { outline:none; border-color:var(--acc); }
.inputbar button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:8px 20px; font-size:0.9rem; cursor:pointer; }
.inputbar button:disabled { opacity:0.4; cursor:default; }
.empty { color:var(--dim); text-align:center; margin-top:40px; font-size:0.9rem; }
</style>
</head>
<body>
<header>
  <h1>💬 Chat <a href="/">← Master</a><span class="v" id="status">verbinde …</span></h1>
</header>
<div class="controls">
  <span class="clabel">Chat filtern</span>
  <select id="sat-select" onchange="switchSat()"><option value="">Alle Geräte</option></select>
  <span class="clabel" style="margin-left:6px">Abspielen auf</span>
  <select id="out-select"><option value="browser">🖥 Browser</option><option value="all">📢📢 Alle Geräte</option></select>
  <label style="margin-left:6px"><input type="checkbox" id="speak-toggle" checked> Antwort abspielen</label>
  <label style="margin-left:auto"><span id="rec-info" class="num" style="color:var(--dim);font-size:0.78rem"></span></label>
</div>
<div class="chat" id="chat"></div>
<div class="inputbar">
  <input id="chat-input" placeholder="Nachricht an den Assistenten …" autocomplete="off">
  <button id="btn-send" onclick="sendMsg()">Senden</button>
</div>

<script>
const $ = id => document.getElementById(id);
let mac = localStorage.getItem("chat_mac") || "";
let lastTs = 0;
const audio = new Audio();
let audioBusy = null;
const SATNAMES = {}; // mac -> Anzeigename (aus /api/satellites)

// ── Namen ─────────────────────────────────────────────────────
function nameOf(m) {
  if (!m) return "?";
  if (m === "web") return "Web-Chat";
  if (m === "all") return "Alle Geräte";
  return SATNAMES[m] || m;
}

// ── Aufnahme-Wiedergabe: Key berechnet der Master (/api/chat/recq).
// Der WebUI-Hashing-Weg (crypto.subtle) steht auf HTTP-LAN-IPs nicht zur
// Verfuegung (insecure context) -> silent failure; deshalb Serverschluessel. ──
function recUrl(text) { return "/api/chat/recq?text=" + encodeURIComponent(text); }
function resetBtn(btn) {
  if (!btn) return;
  if (audioBusy === btn) { audioBusy.classList.remove("stop"); audioBusy.textContent = "▶ Abspielen"; audioBusy = null; }
}
function stopAudio() {
  audio.pause(); audio.src = "";
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch {} }
  resetBtn(audioBusy);
}
function stopAudioKeepBtn() { audio.pause(); audio.src = ""; }

async function playRec(text, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  audio.src = recUrl(text);
  audio.onended = stopAudio;
  audio.onerror = stopAudio;
  btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
  audioBusy = btn;
  audio.play().catch(stopAudio);
}
function playUrl(url, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  audio.src = url;
  audio.onended = stopAudio;
  audio.onerror = stopAudio;
  btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
  audioBusy = btn;
  audio.play().catch(stopAudio);
}
function musicUrl(path) {
  if (!path) return null;
  if (/^https?:\/\//.test(path)) return path;
  return "/proxy/music/" + path.replace(/^\/+/, "");
}

// ── Abspielen: Browser (Aufnahme sonst Browser-TTS) oder PI ────
// Browser: zuerst die TTS-Aufnahme vom Master (Web-Chat-Antworten haben eine),
// sonst Browser-TTS (Satelliten-Antworten haben keine Aufnahme).
async function playBrowser(text, btn) {
  if (audioBusy === btn) { stopAudio(); return; }
  stopAudio();
  const r = await fetch(recUrl(text)).catch(() => null);
  if (r && r.ok) {
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    audio.src = u;
    audio.onended = () => { stopAudio(); URL.revokeObjectURL(u); };
    audio.onerror = () => { stopAudio(); URL.revokeObjectURL(u); };
    btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
    audioBusy = btn;
    audio.play().catch(stopAudio);
  } else {
    speakSynth(text, btn);
  }
}
function speakSynth(text, btn) {
  if (!("speechSynthesis" in window)) { $("status").textContent = "Browser-TTS nicht verfügbar"; return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if (btn) {
    btn.classList.add("stop"); btn.textContent = "⏹ Stoppen";
    audioBusy = btn;
    u.onend = u.onerror = () => { if (audioBusy === btn) { resetBtn(btn); } };
  }
  window.speechSynthesis.speak(u);
}
async function broadcastTo(satMac, text, btn) {
  // PI / anderes Gerät: Text an den Satelliten -> dort TTS + Lautsprecher
  // (POST /api/broadcast -> /speak). wait=false -> sofort zurück, TTS läuft
  // auf dem Gerät im Hintergrund.
  if (btn) { btn.classList.add("stop"); btn.textContent = "… Sende"; }
  $("status").textContent = "→ " + nameOf(satMac);
  try {
    const r = await fetch("/api/broadcast", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ sat: satMac, text: text, wait: false })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok === false) $("status").textContent = d.error || "Sende fehlgeschlagen (" + r.status + ")";
  } catch (e) {
    $("status").textContent = "Sende-Fehler";
  }
  // audioBusy wird in diesem Pfad nie gesetzt -> nicht daran festmachen;
  // Button zuruecksetzen, solange er noch im Sende-Zustand ist.
  setTimeout(() => {
    if (btn && btn.textContent === "… Sende") {
      btn.classList.remove("stop");
      btn.textContent = "▶ Abspielen";
    }
  }, 3500);
}
// Eintrag abspielen – Zielgerät = aktueller "Abspielen auf"-Auswahlwert.
function speakOut(entry, btn) {
  const out = $("out-select").value;
  const text = (entry.text || "").trim();
  if (!text) return;
  if (out === "browser") playBrowser(text, btn);
  else broadcastTo(out, text, btn);
}

// ── Rendering ─────────────────────────────────────────────────
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}) +
         " " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function renderEntry(e) {
  const div = document.createElement("div");
  const kind = e.kind || "system";
  const dev = e.mac || "";
  const devname = nameOf(e.mac);
  div.className = "msg " + kind;
  let who = "", playHtml = "", body = esc(e.text);
  if (kind === "user") {
    // Eingabe -> Quellgerät (wo es erkannt wurde)
    who = `<span class="badge in">🎤 ${esc(devname)}</span>`;
    playHtml = `<div class="play"><button>▶ Abspielen</button><span>Ausgabe</span></div>`;
  } else if (kind === "assistant") {
    // Ausgabe -> echtes Zielgerät (wo die Antwort gesprochen wird), nicht das
    // Eingabegerät. e.out = 'browser' | Satellit-Key; 📢 = an Gerät gebroadcastt.
    const tgt = e.out || e.mac;
    const bcast = e.out && e.out !== "browser";
    who = `<span class="badge out">${bcast ? "🔊📢" : "🔊"} ${esc(nameOf(tgt))}${bcast ? " · Broadcast" : ""}</span>`;
    playHtml = `<div class="play"><button>▶ Abspielen</button><span>Ausgabe</span></div>`;
  } else if (kind === "musik") {
    who = `<span class="badge mus">🎵 ${esc(devname)}</span>`;
    const url = musicUrl(e.path);
    playHtml = url ? `<div class="play"><button>▶ Wiedergabe</button></div>` : "";
  } else {
    who = `<span class="badge">${esc(devname || "System")}</span>`;
  }
  div.innerHTML = `<span class="who">${who}</span>${body}${playHtml}<div class="time">${fmtTime(e.ts)}</div>`;
  const btn = div.querySelector(".play button");
  if (btn) {
    if (kind === "musik") btn.onclick = () => playUrl(musicUrl(e.path), btn);
    else btn.onclick = () => speakOut(e, btn);
  }
  return div;
}

// Dedup: gleiche (kind,mac,text)-Eintraege nicht doppelt rendern
const seen = new Set();
const ekey = e => (e.kind || "system") + "|" + (e.mac || "") + "|" + (e.text || "");

async function loadEntries() {
  const q = mac ? "?mac=" + encodeURIComponent(mac) + "&limit=200" : "?limit=200";
  const r = await fetch("/api/chat/messages" + q);
  if (!r.ok) { $("status").textContent = "Fehler " + r.status; return; }
  const data = await r.json();
  $("status").textContent = "";
  const chat = $("chat");
  const entries = data.entries || [];
  const prevTs = lastTs;
  lastTs = Math.max(lastTs, ...(entries.map(e => e.ts) || [0]));
  if (prevTs === 0) {
    chat.innerHTML = "";
    seen.clear();
    if (!entries.length) {
      chat.innerHTML = '<div class="empty">Noch keine Einträge.<br>Sprech-Turne (Eingabe/Ausgabe) und Musik erscheinen hier.</div>';
      return;
    }
    // API liefert neueste zuerst — fuer Chat-Ansicht (neueste unten) umdrehen
    for (const e of [...entries].reverse())
      if (!seen.has(ekey(e))) { seen.add(ekey(e)); chat.appendChild(renderEntry(e)); }
    chat.scrollTop = chat.scrollHeight;
    return;
  }
  // Inkrementell: nur neue Eintraege, chronologisch aufsteigend, ans Ende haengen
  const newE = entries.filter(e => e.ts > prevTs).sort((a, b) => a.ts - b.ts);
  if (newE.length) {
    for (const e of newE)
      if (!seen.has(ekey(e))) { seen.add(ekey(e)); chat.appendChild(renderEntry(e)); }
    chat.scrollTop = chat.scrollHeight;
  }
  $("status").textContent = "";
}

// ── Web-Chat senden ───────────────────────────────────────────
async function sendMsg() {
  const text = $("chat-input").value.trim();
  if (!text) return;
  $("chat-input").value = "";
  $("btn-send").disabled = true;
  $("status").textContent = "verarbeite …";
  // optimistic user entry (Quellgerät = Web-Chat, Zielgerät folgt aus Antwort)
  const mine = { kind:"user", text, ts: Date.now()/1000, mac: mac || "web" };
  const div = renderEntry(mine);
  seen.add(ekey(mine));
  $("chat").appendChild(div);
  try {
    const r = await fetch("/api/chat/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text, mac, speak: $("speak-toggle").checked,
                             out: $("out-select").value })
    });
    const data = await r.json();
    if (r.ok && data.answer) {
      const outTgt = data.out || $("out-select").value;
      const a = renderEntry({ kind:"assistant", text: data.answer, ts: data.ts || Date.now()/1000, mac: mac || "web", out: outTgt });
      seen.add(ekey({ kind:"assistant", mac: mac || "web", text: data.answer }));
      $("chat").appendChild(a);
      $("chat").scrollTop = $("chat").scrollHeight;
      if (data.broadcast === "started")
        $("status").textContent = "Antwort an " + nameOf(outTgt) + " gebroadcastet";
    } else {
      $("status").textContent = data.error || "Fehler " + r.status;
    }
  } catch (e) {
    $("status").textContent = "Verbindung fehlgeschlagen";
  }
  $("btn-send").disabled = false;
}

// ── Geräte-Liste: befüllt beide Auswahlfelder + Namenstabelle ──
async function loadSats() {
  const r = await fetch("/api/satellites");
  if (!r.ok) return;
  const sats = await r.json();
  const filt = $("sat-select");
  const out = $("out-select");
  for (const s of sats) {
    const label = s.custom_name || s.name || s.hostname || s.mac;
    SATNAMES[s.mac] = label;
    const o1 = document.createElement("option");
    o1.value = s.mac; o1.textContent = label;
    filt.appendChild(o1);
    const o2 = document.createElement("option");
    o2.value = s.mac; o2.textContent = "📢 " + label;
    out.appendChild(o2);
  }
  if (mac) filt.value = mac;
}
function switchSat() {
  mac = $("sat-select").value;
  localStorage.setItem("chat_mac", mac);
  seen.clear();
  lastTs = 0;
  $("chat").innerHTML = "";
  loadEntries();
}

$("chat-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
loadSats();
loadEntries();
setInterval(() => { if (!$("btn-send").disabled) loadEntries(); }, 10000);
// Aufnahme-Liste (Info-Zeile)
(async () => {
  try {
    const r = await fetch("/api/chat/recs");
    const d = await r.json();
    $("rec-info").textContent = (d.recs || []).length + " TTS-Aufnahmen";
  } catch {}
})();
</script>
</body>
</html>
